<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lot Inventory</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}">
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="/profile">Profile</a>
      <a href="/awards">Equity Awards</a>
      <a href="/exercises">Exercises</a>
      <a href="/transactions">Transactions</a>
      <a class="active" href="/lots">Lot inventory</a>
      <a href="/scenarios">Scenarios</a>
      <a href="/tax-results">Tax Results</a>
      <a href="/imports">Imports</a>
    </div>
  </nav>
  <main class="container lots-page">
    <header>
      <div><h1>Lot inventory</h1><p>Shares created by completed option exercises and RSU settlements.</p></div><button class="secondary-button danger" type="button" data-clear-page="lots" data-clear-label="lot inventory" data-clear-message="Acquisition transactions and dependent sales that created these lots will also be removed.">Clear data</button>
    </header>
    <section class="summary-grid" aria-label="Lot summary">
      <div><span>Shares acquired</span><strong id="sharesAcquired">0</strong></div>
      <div><span>Shares sold</span><strong id="sharesSold">0</strong></div>
      <div><span>Shares remaining</span><strong id="sharesRemaining">0</strong></div>
    </section>
    <div class="list-toolbar"><h2>All lots</h2><select id="lotFilter" aria-label="Filter lots"><option value="All">All lots</option><option value="Open">Open lots</option><option value="Fully sold">Fully sold lots</option></select></div>
    <section class="lot-list" id="lotsBody"><div class="empty-state">Loading lots...</div></section>
  </main>
  <script src="{{ url_for('static', filename='lots.js') }}"></script>
  <script src="{{ url_for('static', filename='clear-data.js') }}"></script>
</body>
</html>
